spring.application.name=spring-ai-assistant
server.port=8081

# ---------- OpenRouter connection ----------
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1

# ---------- Model settings ----------
spring.ai.openai.chat.model=openai/gpt-4o-mini
spring.ai.openai.chat.temperature=0.3

# ---------- Turn off what we don't use ----------
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.tools.throw-exception-on-error=true

spring.datasource.url=jdbc:postgresql://localhost:5432/assistant
spring.datasource.username=assistant
spring.datasource.password=assistant
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

logging.level.org.springframework.ai.chat.client.advisor=INFO
logging.level.com.learn.assistant=INFO


