spring.application.name=spring-ai-multi-agent
server.port=8084

# ---------- OpenRouter ----------
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=nvidia/nemotron-3-ultra-550b-a55b:free

# ---------- Only chat is used ----------
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ---------- MCP client ----------
spring.ai.mcp.client.name=travel-planner
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.india-utils.url=http://localhost:8090

# ---------- Errors & logging ----------
spring.mvc.problemdetails.enabled=true
logging.level.com.learn.agents=INFO

