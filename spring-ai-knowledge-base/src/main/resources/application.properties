spring.application.name=spring-ai-knowledge-base
server.port=8082

# ---------- OpenRouter connection ----------
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1

# ---------- Chat model ----------
spring.ai.openai.chat.model=openai/gpt-4o-mini
spring.ai.openai.chat.temperature=0.2

# ---------- Embedding model ----------
spring.ai.openai.embedding.model=openai/text-embedding-3-small

# ---------- Turn off models we don't use ----------
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/knowledge
spring.datasource.username=knowledge
spring.datasource.password=knowledge

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- Vector store (PGVector) ----------
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

# ---------- RAG settings ----------
app.rag.top-k=4
app.rag.similarity-threshold=0.3
app.rag.hybrid-enabled=true
app.rag.candidates-per-search=10
app.rag.not-found-message=I couldn't find this in the uploaded documents.

# ---------- File uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Errors & logging ----------
spring.mvc.problemdetails.enabled=true
logging.level.com.learn.knowledge=INFO
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

